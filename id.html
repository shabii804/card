<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee ID Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#eef2f4; --panel:#ffffff; --ink:#1c2429; --muted:#5d6b73; --line:#d3dce1;
    --brand:#1f7fa3; --accent:#f0a030;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:20px 24px 0}
  header h1{margin:0;font-size:22px}
  header p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;padding:20px 24px 40px;align-items:start}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .panel h2{font-size:15px;margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=tel]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
  input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  input[type=file]{font-size:13px;width:100%}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{font-family:inherit;font-size:14px;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.danger{color:#a33}
  .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
  .stage{overflow:auto;padding-bottom:8px}
  .hint{font-size:13px;color:var(--muted);margin:10px 0 0}
  .saved{margin-top:16px}
  .saved ul{list-style:none;margin:0;padding:0}
  .saved li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .saved li span small{display:block;color:var(--muted)}
  .saved li div{display:flex;gap:6px}
  .saved button{padding:5px 9px;font-size:12px}

  /* ---------- the card ---------- */
  #card{
    position:relative;width:640px;height:380px;background:#fff;
    border:1px solid #cfd6da;box-shadow:0 2px 8px rgba(0,0,0,.12);
    font-family:"Poppins","Segoe UI",Arial,Helvetica,sans-serif;color:#1c2429;overflow:hidden;flex:none;
  }
  #card .co{position:absolute;left:22px;top:30px;font-size:38px;font-weight:700;color:var(--brand);letter-spacing:.3px;white-space:nowrap;line-height:1.15}
  #card .tag{position:absolute;left:22px;top:90px;font-size:13px;font-weight:600;letter-spacing:1.6px;color:#c7811a;white-space:nowrap;line-height:1.3}
  #card .ln{position:absolute;left:22px;font-size:14px;font-weight:500;color:#2c3a42;white-space:nowrap;line-height:1.3}
  #card .cell{font-weight:600;font-size:15px;color:#1c2429}
  #card .rule{position:absolute;left:22px;top:194px;width:430px;height:2px;background:#d6e6ed}
  #card .row{position:absolute;left:22px;width:440px;display:flex;align-items:baseline;white-space:nowrap;margin:0}
  #card .k{width:194px;flex:none;font-size:21px;font-weight:700;letter-spacing:.2px;color:#111}
  #card .v{flex:1;min-width:0;overflow:hidden;font-size:24px;font-weight:700;color:#111;line-height:1.35}
  #card.compact-address #vA2{display:none}
  #card.compact-address .rule{top:168px}
  #card.compact-address .row{transform:translateY(-26px)}
  #card .logo{position:absolute;left:497px;top:28px;width:135px;height:120px;display:flex;align-items:center;justify-content:center}
  #card .logo img,#card .logo svg{max-width:100%;max-height:100%}
  #card .photo{position:absolute;left:466px;top:182px;width:168px;height:162px;background:#58b8d8;overflow:hidden}
  #card .photo img{width:100%;height:100%;object-fit:cover;display:block}
  #card .stamp{position:absolute;left:452px;top:262px;width:130px;font-size:9px;font-weight:700;color:rgba(40,70,190,.55);transform:rotate(18deg);line-height:1.15;text-align:center;border:1.5px solid rgba(40,70,190,.45);border-radius:6px;padding:3px;display:none}
  #card.stamped .stamp{display:block}

  @media print{
    body{background:#fff}
    header,.panel,.hint{display:none!important}
    .wrap{display:block;padding:0}
    #card{box-shadow:none}
  }
</style>
</head>
<body>
<header>
  <h1>Employee ID Card Maker</h1>
  <p>Fill in the details, add a photo, then download the card as an image.</p>
</header>

<div class="wrap">
  <section class="panel" aria-label="Card details">
    <h2>Card details</h2>

    <label for="company">Company name</label>
    <input type="text" id="company" value="MR PROFESSIONAL">

    <label for="tag">Tagline</label>
    <input type="text" id="tag" value="HOME MAINTENANCE COMPANY">

    <label for="addr1">Address line 1</label>
    <input type="text" id="addr1" value="Address: Precent 27 Ali Dhad ghot">

    <label for="addr2">Address line 2</label>
    <input type="text" id="addr2" value="">

    <label for="name">Employee name</label>
    <input type="text" id="name" value="Hammad Ali">

    <label for="idno">ID card number</label>
    <input type="text" id="idno" value="3120593907653">

    <label for="desig">Designation</label>
    <input type="text" id="desig" value="Electrician">

    <label for="photo">Employee photo</label>
    <input type="file" id="photo" accept="image/*">

    <label for="logo">Company logo (optional, replaces the default logo)</label>
    <input type="file" id="logo" accept="image/*">

    <div class="check">
      <input type="checkbox" id="stampOn"><label for="stampOn" style="margin:0">Add company stamp over the photo</label>
    </div>

    <div class="row">
      <button class="primary" id="dl">Download PNG</button>
      <button id="print">Print</button>
      <button id="save">Save employee</button>
      <button class="danger" id="reset">Reset</button>
    </div>

    <div class="saved" id="savedBox" hidden>
      <h2 style="margin-top:18px">Saved employees</h2>
      <ul id="savedList"></ul>
    </div>
  </section>

  <section>
    <div class="stage">
      <div id="card">
        <div class="co" id="vCo"></div>
        <div class="tag" id="vTag"></div>
        <div class="ln" id="vA1" style="top:122px"></div>
        <div class="ln" id="vA2" style="top:148px"></div>

        <div class="logo" id="vLogo"></div>

        <div class="rule"></div>
        <div class="row" style="top:210px"><span class="k">NAME :</span><span class="v" id="vName"></span></div>
        <div class="row" style="top:262px"><span class="k">ID CARD NO :</span><span class="v" id="vId"></span></div>
        <div class="row" style="top:314px"><span class="k">DESIGNATION :</span><span class="v" id="vDes"></span></div>

        <div class="photo" id="vPhoto"></div>
        <div class="stamp" id="vStamp"></div>
      </div>
    </div>
    <p class="hint">The card is 640 &times; 380 px. The download is saved at double size so it prints sharply.</p>
  </section>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var DEFAULTS = {
    company:"MR PROFESSIONAL", tag:"HOME MAINTENANCE COMPANY",
    addr1:"Address: Precent 27 Ali Dhad ghot", addr2:"",
     name:"Hammad Ali", idno:"3120593907653", desig:"Electrician"
  };
  var photoData = "", logoData = "";

  function fit(el, maxPx, startPx){
    el.style.fontSize = startPx + "px";
    var i = 0;
    while(el.scrollWidth > maxPx && i < 60){ startPx -= 1; el.style.fontSize = startPx + "px"; i++; }
  }

  function render(){
    $("vCo").textContent = $("company").value;
    $("vTag").textContent = $("tag").value;
    $("vA1").textContent = $("addr1").value;
    $("vA2").textContent = $("addr2").value;
    $("card").classList.toggle("compact-address", !$("addr2").value.trim());
    
    $("vName").textContent = $("name").value;
    $("vId").textContent = $("idno").value;
    $("vDes").textContent = $("desig").value;

    // company title must stay inside the left area
    var co = $("vCo"); co.style.display = "inline-block";
    fit(co, 450, 38);

    // logo
    var lg = $("vLogo");
    lg.innerHTML = "";
    if(logoData){ var im = new Image(); im.src = logoData; lg.appendChild(im); }
    else { lg.appendChild(document.importNode($("defaultLogo").content, true)); }

    // photo
    var ph = $("vPhoto");
    ph.innerHTML = "";
    if(photoData){ var p = new Image(); p.src = photoData; ph.appendChild(p); }

    // stamp text
    $("vStamp").textContent = $("tag").value || "";
    $("card").classList.toggle("stamped", $("stampOn").checked);

    // keep long values inside the row (they shrink only if too long)
    ["vName","vId","vDes"].forEach(function(id){
      var el=$(id); fit(el, el.clientWidth, 24);
    });
  }

  function readImage(file, cb){
    if(!file) return cb("");
    var r = new FileReader();
    r.onload = function(){ cb(r.result) };
    r.readAsDataURL(file);
  }

  ["company","tag","addr1","addr2","name","idno","desig"].forEach(function(id){
    $(id).addEventListener("input", render);
  });
  $("stampOn").addEventListener("change", render);
  $("photo").addEventListener("change", function(e){ readImage(e.target.files[0], function(d){ photoData = d; render(); }); });
  $("logo").addEventListener("change", function(e){ readImage(e.target.files[0], function(d){ logoData = d; render(); }); });

  $("dl").addEventListener("click", function(){
    if(typeof html2canvas === "undefined"){
      alert("The image tool could not load. Check your internet connection, or use Print and choose Save as PDF.");
      return;
    }
    html2canvas($("card"), {scale:2, backgroundColor:"#ffffff", useCORS:true}).then(function(canvas){
      var a = document.createElement("a");
      var nm = ($("name").value || "employee").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
      a.download = "id-card-" + nm + ".png";
      a.href = canvas.toDataURL("image/png");
      document.body.appendChild(a); a.click(); a.remove();
    });
  });
  $("print").addEventListener("click", function(){ window.print(); });

  $("reset").addEventListener("click", function(){
    Object.keys(DEFAULTS).forEach(function(k){
      var map = {company:"company",tag:"tag",addr1:"addr1",addr2:"addr2",name:"name",idno:"idno",desig:"desig"};
      $(map[k]).value = DEFAULTS[k];
    });
    photoData = ""; logoData = "";
    $("photo").value = ""; $("logo").value = ""; $("stampOn").checked = false;
    render();
  });

  /* ---- saved employees (stored in this browser only) ---- */
  var KEY = "idcard_employees_v1";
  function loadList(){
    try{ return JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(e){ return []; }
  }
  function storeList(list){
    try{ localStorage.setItem(KEY, JSON.stringify(list)); return true; }catch(e){
      alert("This browser could not save the list (storage is full or blocked). Download the card instead."); return false;
    }
  }
  function renderList(){
    var list = loadList(), ul = $("savedList");
    ul.innerHTML = "";
    $("savedBox").hidden = list.length === 0;
    list.forEach(function(item, i){
      var li = document.createElement("li");
      var s = document.createElement("span");
      s.textContent = item.name || "(no name)";
      var sm = document.createElement("small"); sm.textContent = item.desig || ""; s.appendChild(sm);
      var d = document.createElement("div");
      var b1 = document.createElement("button"); b1.textContent = "Load";
      b1.onclick = function(){
        $("company").value=item.company; $("tag").value=item.tag; $("addr1").value=item.addr1; $("addr2").value=item.addr2;
        $("name").value=item.name; $("idno").value=item.idno; $("desig").value=item.desig;
        photoData = item.photo || ""; logoData = item.logo || ""; $("stampOn").checked = !!item.stamp; render();
      };
      var b2 = document.createElement("button"); b2.textContent = "Delete"; b2.className = "danger";
      b2.onclick = function(){ var l = loadList(); l.splice(i,1); storeList(l); renderList(); };
      d.appendChild(b1); d.appendChild(b2); li.appendChild(s); li.appendChild(d); ul.appendChild(li);
    });
  }
  $("save").addEventListener("click", function(){
    var list = loadList();
    var rec = {company:$("company").value, tag:$("tag").value, addr1:$("addr1").value, addr2:$("addr2").value,
      name:$("name").value, idno:$("idno").value, desig:$("desig").value,
      photo:photoData, logo:logoData, stamp:$("stampOn").checked};
    var at = -1;
    list.forEach(function(x,i){ if(x.idno === rec.idno && rec.idno) at = i; });
    if(at >= 0) list[at] = rec; else list.push(rec);
    if(storeList(list)) renderList();
  });

  render(); renderList();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(render); }
})();
</script>
